[project]
name = "agentic-rag-qa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "PyMuPDF>=1.24",
    "openai>=1.40",
    "ragas>=0.1.20",
    "pytest>=8.0",
    "datasets>=2.20",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
